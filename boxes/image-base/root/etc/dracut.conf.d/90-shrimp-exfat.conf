# Nośnik Shrimp Install (Beta 5+): system live leży na partycji exFAT „SHRIMP_LIVE”
# (LiveOS/squashfs.img), a rozruch na FAT32 „SHRIMP_BOOT”. kiwi-live montuje nośnik typem
# z blkid, więc initrd potrzebuje modułu exfat. Zapis ISO bezpośrednio (dd) nadal działa (iso9660).
add_drivers+=" exfat vfat nls_cp437 nls_iso8859_1 nls_utf8 "
