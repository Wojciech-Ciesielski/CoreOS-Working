# Z argumentem --live (kontener iso-live) dochodzi sesja kiosku z kreatorem i usługi Agamy.
[box]
id = "setup"
version = "0.1.0"
kind = "app"
summary = "Shrimp Setup: jeden kreator instalacji i konfiguracji (GTK4 + libadwaita, Agama), sesja kiosku na nośniku"
depends = ["linu-x"]   # drivers.conf: pakiety kroku „Obraz i dźwięk”
build_depends = ["i18n-core", "install-schema", "shrimp-i18n"]
ci = "setup"

[packages]
image = [
    "libgtk-4-1",
    "libadwaita-1-0",
    "iso-codes",
    "polkit",
    "agama",
    "agama-yast",
    "agama-web-ui",
    "agama-cli",
]
build = [
    "bash",
    "coreutils",
    "findutils",
    "gawk",
    "gcc",
    "pkg-config",
    "rustup",
    "ca-certificates",
    "ca-certificates-mozilla",
    "pkgconfig(gtk4)",
    "pkgconfig(libadwaita-1)",
]

[build]
chroot = "cd shell && cargo build --release --locked"
outputs = ["shell/target/release/shrimp-setup"]
install = "install.sh"
