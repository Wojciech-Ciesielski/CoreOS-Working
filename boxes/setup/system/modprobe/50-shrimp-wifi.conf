# Karty MediaTek MT7921/MT7922 (np. w laptopach ASUS) potrafią nie wstać z oszczędzaniem energii PCIe (ASPM),
# zwłaszcza po ponownym uruchomieniu z Windows: sterownik się ładuje, a karty Wi-Fi w systemie nie ma.
# Bez ASPM karta bierze odrobinę więcej prądu, ale uruchamia się za każdym razem.
options mt7921e disable_aspm=1
