version: 2
updates:
  - package-ecosystem: cargo
    directories: [/boxes/shrimp-box, /boxes/setup/shell]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      gtk-rs:
        patterns: ["gtk4", "libadwaita", "glib", "gio", "webkit6"]
  - package-ecosystem: npm
    directory: /boxes/setup/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      toolchain:
        patterns: ["typescript", "vite", "vitest"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
