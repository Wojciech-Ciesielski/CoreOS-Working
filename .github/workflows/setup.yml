name: Setup

on:
  push:
    paths: ["boxes/setup/**", "boxes/linu-x/**", "boxes/app-style/**", "boxes/flathub/**", "boxes/i18n-core/**", "boxes/install-schema/**", "boxes/shrimp-i18n/**", ".github/workflows/setup.yml"]
  pull_request:
    paths: ["boxes/setup/**", "boxes/linu-x/**", "boxes/app-style/**", "boxes/flathub/**", "boxes/i18n-core/**", "boxes/install-schema/**", "boxes/shrimp-i18n/**", ".github/workflows/setup.yml"]
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Identyfikatory Flathub z katalogu programów
        run: node boxes/setup/tools/check-flathub.mjs

  shell:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: boxes/setup/shell } }
    steps:
      - uses: actions/checkout@v7
      # shrimp-i18n (teksty) jest w Shrimps-Working, wersja z tools/shrimps.ref.
      - run: tools/fetch-shrimps.sh
        working-directory: .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo test --locked
      - run: cargo build --locked --release

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning boxes/setup/install.sh boxes/setup/system/share/post-install.sh boxes/setup/system/libexec/shrimp-setup-apply boxes/setup/system/libexec/shrimp-usb-backup boxes/setup/system/libexec/shrimp-setup-later boxes/setup/system/libexec/shrimp-wifi-revive boxes/setup/system/libexec/shrimp-offline-repo boxes/setup/tests/test-usb-backup.sh boxes/app-style/shrimp-app-style boxes/app-style/install.sh boxes/setup/system/libexec/shrimp-auto-updates boxes/setup/system/session/shrimp-live-session boxes/setup/tests/test-apply.sh
      - run: boxes/setup/tests/test-apply.sh
      - run: boxes/setup/tests/test-usb-backup.sh
      - run: python3 -c "import yaml; yaml.safe_load(open('boxes/setup/system/agama/shrimp.yaml'))"
