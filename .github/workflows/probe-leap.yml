name: Probe Leap packages
# Tymczasowe: sprawdza, które pakiety są w Leap 16.1 (Beta 6). Do usunięcia przed PR.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-leap.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run --rm opensuse/leap:16.1 bash -c '
            zypper -n --gpg-auto-import-keys ref >/dev/null 2>&1 || true
            for p in systemd-boot sdbootutil shim efibootmgr gnome-kiosk gnome-kiosk-script-session cage mutter distrobox podman wine wine-mono flatpak libwebkitgtk-6_0-4 typelib-1_0-WebKit-6_0 libvte-2_91-0 vte; do
              r=$(zypper -n --no-refresh se -x -s "$p" 2>/dev/null | grep -E "^\S*\s*\|\s*$p\s*\|" | head -n1)
              echo "PROBE $p: ${r:-BRAK}"
            done
            rpm -q --qf "%{VERSION}\n" systemd 2>/dev/null | sed "s/^/systemd /"
            zypper -n --no-refresh info systemd-boot 2>/dev/null | grep -E "Version|Repository" || true
            zypper -n --no-refresh se --provides "/usr/lib/systemd-boot/systemd-bootx64.efi" 2>/dev/null | tail -3 || true
          ' || docker run --rm opensuse/leap:16.0 echo "leap 16.1 image missing"
